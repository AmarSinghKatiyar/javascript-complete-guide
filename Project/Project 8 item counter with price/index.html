<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Item Counter & Price</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Item Counter & Price</h1>

        <!-- Add Item Form -->
        <form id="itemForm">

            <input
                type="text"
                id="itemName"
                placeholder="Enter item name"
                required
            >

            <input
                type="number"
                id="itemPrice"
                placeholder="Enter price"
                min="0"
                step="0.01"
                required
            >

            <button type="submit">
                Add Item
            </button>

        </form>


        <!-- Items -->
        <div id="notesContainer">

            <!-- Example Card -->
            <div class="card">

                <h3>Apple</h3>

                <p>
                    Price: ₹50
                </p>

                <p>
                    Quantity:
                </p>

                <div class="counter">

                    <button class="minusBtn">
                        −
                    </button>

                    <span class="quantity">
                        1
                    </span>

                    <button class="plusBtn">
                        +
                    </button>

                </div>

                <p>
                    Total: ₹50
                </p>

                <button class="deleteBtn">
                    Delete
                </button>

            </div>


            <!-- Another Example Card -->
            <div class="card">

                <h3>Milk</h3>

                <p>
                    Price: ₹60
                </p>

                <p>
                    Quantity:
                </p>

                <div class="counter">

                    <button class="minusBtn">
                        −
                    </button>

                    <span class="quantity">
                        2
                    </span>

                    <button class="plusBtn">
                        +
                    </button>

                </div>

                <p>
                    Total: ₹120
                </p>

                <button class="deleteBtn">
                    Delete
                </button>

            </div>

        </div>


        <!-- Grand Total -->
        <h2 id="grandTotal">
            Grand Total: ₹170
        </h2>

    </div>


    <script src="script.js"></script>

</body>
</html>
