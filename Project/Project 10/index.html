<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Ingredients Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Recipe Ingredients Manager</h1>

    <form id="recipeForm">

        <input
            type="text"
            id="ingredient"
            placeholder="Ingredient Name"
            required
        >

        <input
            type="text"
            id="quantity"
            placeholder="Quantity (e.g. 2 Cups)"
            required
        >

        <button type="submit">
            Add Ingredient
        </button>

    </form>

    <h3>Total Ingredients :
        <span id="totalIngredients">0</span>
    </h3>

    <div id="ingredientContainer"></div>

</div>

<script src="script.js"></script>

</body>
</html>
