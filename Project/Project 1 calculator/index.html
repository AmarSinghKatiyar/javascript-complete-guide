<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="main">
        <h1 class="heading">Calculator</h1>
        <div class="takeinput">
            <input class="num1" type="number">
            <input class="num2" type="number">
        </div>
        <div class="button">

            <button class="b2">-</button>
            <button class="b3">*</button>
            <button class="b4">/</button>
        </div>
        <div class="final">
            <button class="result">Result</button>
            <h1 class="res">0</h1>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
