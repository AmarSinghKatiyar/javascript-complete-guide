<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Expense Tracker</title>


    <link rel="stylesheet" href="style.css">
</head>


<body>


    <div class="container">


        <h1>Expense Tracker</h1>


        <!-- SUMMARY -->


        <div class="summary">


            <div class="card">
                <h3>Balance</h3>
                <p id="balance">₹0</p>
            </div>


            <div class="card income-card">
                <h3>Income</h3>
                <p id="income">₹0</p>
            </div>


            <div class="card expense-card">
                <h3>Expense</h3>
                <p id="expense">₹0</p>
            </div>


        </div>




        <!-- FORM -->


        <div class="form-section">


            <h2>Add Transaction</h2>


            <form id="transactionForm">


                <div class="form-group">


                    <label>Description</label>


                    <input type="text" id="description" placeholder="e.g. Grocery">


                </div>




                <div class="form-group">


                    <label>Amount</label>


                    <input type="number" id="amount" placeholder="e.g. 500">


                </div>




                <div class="form-group">


                    <label>Type</label>


                    <select id="type">


                        <option value="expense">
                            Expense
                        </option>


                        <option value="income">
                            Income
                        </option>


                    </select>


                </div>




                <div class="form-group">


                    <label>Category</label>


                    <select id="category">


                        <option value="food">
                            Food
                        </option>


                        <option value="transport">
                            Transport
                        </option>


                        <option value="shopping">
                            Shopping
                        </option>


                        <option value="bills">
                            Bills
                        </option>


                        <option value="salary">
                            Salary
                        </option>


                        <option value="other">
                            Other
                        </option>


                    </select>


                </div>




                <button type="submit">
                    Add Transaction
                </button>


            </form>


        </div>




        <!-- FILTERS -->


        <div class="filter-section">


            <input type="text" id="search" placeholder="Search transactions...">




            <select id="filterType">


                <option value="all">
                    All
                </option>


                <option value="income">
                    Income
                </option>


                <option value="expense">
                    Expense
                </option>


            </select>




            <select id="filterCategory">


                <option value="all">
                    All Categories
                </option>


                <option value="food">
                    Food
                </option>


                <option value="transport">
                    Transport
                </option>


                <option value="shopping">
                    Shopping
                </option>


                <option value="bills">
                    Bills
                </option>


                <option value="salary">
                    Salary
                </option>


                <option value="other">
                    Other
                </option>


            </select>




            <select id="sort">


                <option value="latest">
                    Latest
                </option>


                <option value="highest">
                    Highest Amount
                </option>


                <option value="lowest">
                    Lowest Amount
                </option>


            </select>


        </div>




        <!-- TRANSACTIONS -->


        <div class="transactions-section">


            <div class="transaction-header">


                <h2>Transactions</h2>


                <button id="clearAll">
                    Clear All
                </button>


            </div>




            <div id="transactionList">


                <!-- Transactions will be created by JS -->


            </div>


        </div>


    </div>




    <script src="script.js"></script>


</body>


</html>
