<body>
    <div class="main">
        <h1 class="mainh1">Student Admission Form</h1>
        <div class="innerfrom">
            <form>
                <div class="detail">
                    <h3>Full Name</h3>
                    <input type="text" placeholder="Enter your full name">
                    <h3>Email</h3>
                    <input type="email" placeholder="Enter your email">
                    <h3>Admission Password</h3>
                    <input type="text" placeholder="Create a Password">
                    <h3>Age</h3>
                    <input type="number" placeholder="Enter your age">
                    <h3>Date of Birth</h3>
                    <input type="date">
                    <h3>Preferred Interview Time</h3>
                    <input type="time">
                </div>
                <div class="gender-group">
                    <h3>Select Gender</h3>
                    <input type="radio" id="male" name="gender">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender">
                    <label for="female">Female</label>
                    <input type="radio" id="other" name="gender">
                    <label for="other">Other</label>

                </div>

                <div class="course">
                    <h3>Select Course</h3>
                    <select name="Select Course" id="Courseid">
                        <option value="" selected disabled>Select Course</option>
                        <option value="B.Tech">B.Tech</option>
                        <option value="BBA">BBA</option>
                        <option value="BCA">BCA</option>
                        <option value="MCA">MCA</option>
                    </select>
                </div>

                <div class="address">
                    <h3>Address</h3>
                    <textarea name="" id="address" placeholder="Enter your complete address"></textarea>
                </div>

                <div class="skills">
                    <h3>Skills</h3>
                    <input type="checkbox" name="skills[]" id="HTML">
                    <label for="html">HTML</label>
                    <input type="checkbox" name="skills[]" id="CSS">
                    <label for="CSS">CSS</label>
                    <input type="checkbox" name="skills[]" id="JAVASCRIPT">
                    <label for="JAVASCRIPT">JAVASCRIPT</label>
                    <input type="checkbox" name="skills[]" id="REACT">
                    <label for="REACT">REACT</label>
                </div>

                <div class="upload">
                    <h3>Upload Student Photo</h3>
                    <input type="file" class="fileinp">
                    <button class="uploadbtn" type="button">Upload Photo</button>
                    <p class="filename">No File Choosen</p>
                </div>

                <div class="terms">
                    <input type="checkbox" id="termsandcondition" required>
                    <label for="termsandcondition">I agree to the terms and conditions.</label>
                </div>

                <button class="submitbtn" type="submit">Submit Application</button>
            </form>
        </div>
        <div class="middle">
            <h3 class="middlehead">Submitted Application</h3>
        </div>
