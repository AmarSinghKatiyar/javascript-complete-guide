*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    padding:40px;
}

.container{
    width:700px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

input,
textarea{
    padding:12px;
    font-size:16px;
}

textarea{
    resize:none;
    height:120px;
}

button{
    padding:12px;
    border:none;
    background:royalblue;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#2458d3;
}

#notesContainer{
    margin-top:25px;
    display:grid;
    grid-template-columns: 1fr 1fr;
    /* grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); */
    gap:20px;
}

.card{
    background:#fff8b5;
    padding:15px;
    border-radius:8px;
    box-shadow:0 0 8px rgba(0,0,0,.15);
}

.card h3{
    margin-bottom:10px;
}

.card p{
    margin-bottom:15px;
    word-break:break-word;
}

    width:100%;
}
